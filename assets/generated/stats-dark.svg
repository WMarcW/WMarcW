<svg xmlns="http://www.w3.org/2000/svg" width="420" height="308" viewBox="0 0 420 308" role="img" aria-label="GitHub Stats">
<style>.f{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.r{animation:in .6s ease-out both}@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="419" height="307" rx="14" fill="#0D1320" stroke="#25304A"/>
<rect x="24" y="26" width="4" height="18" rx="2" fill="#FFB547"/>
<text x="38" y="41" class="f" font-size="17" font-weight="700" fill="#EEF2F8">GitHub Stats</text>
<g class="r" style="animation-delay:0.00s"><text x="24" y="82" class="f" font-size="14" fill="#8B97AD">Contributions (last year)</text><text x="396" y="82" class="m" font-size="15" font-weight="700" fill="#EEF2F8" text-anchor="end">32</text><path d="M24 91H396" stroke="#18223A"/></g>
<g class="r" style="animation-delay:0.08s"><text x="24" y="110" class="f" font-size="14" fill="#8B97AD">Commits</text><text x="396" y="110" class="m" font-size="15" font-weight="700" fill="#EEF2F8" text-anchor="end">29</text><path d="M24 119H396" stroke="#18223A"/></g>
<g class="r" style="animation-delay:0.16s"><text x="24" y="138" class="f" font-size="14" fill="#8B97AD">Pull Requests</text><text x="396" y="138" class="m" font-size="15" font-weight="700" fill="#EEF2F8" text-anchor="end">0</text><path d="M24 147H396" stroke="#18223A"/></g>
<g class="r" style="animation-delay:0.24s"><text x="24" y="166" class="f" font-size="14" fill="#8B97AD">Issues</text><text x="396" y="166" class="m" font-size="15" font-weight="700" fill="#EEF2F8" text-anchor="end">0</text><path d="M24 175H396" stroke="#18223A"/></g>
<g class="r" style="animation-delay:0.32s"><text x="24" y="194" class="f" font-size="14" fill="#8B97AD">Own Repositories</text><text x="396" y="194" class="m" font-size="15" font-weight="700" fill="#EEF2F8" text-anchor="end">6</text><path d="M24 203H396" stroke="#18223A"/></g>
<g class="r" style="animation-delay:0.40s"><text x="24" y="222" class="f" font-size="14" fill="#8B97AD">Contributed to</text><text x="396" y="222" class="m" font-size="15" font-weight="700" fill="#EEF2F8" text-anchor="end">1</text><path d="M24 231H396" stroke="#18223A"/></g>
<g class="r" style="animation-delay:0.48s"><text x="24" y="250" class="f" font-size="14" fill="#8B97AD">Stars</text><text x="396" y="250" class="m" font-size="15" font-weight="700" fill="#EEF2F8" text-anchor="end">1</text><path d="M24 259H396" stroke="#18223A"/></g>
<text x="24" y="290" class="m" font-size="11" fill="#8B97AD">updated Nov 25, 2026</text>
</svg>